<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webux ERP</title>
    <!--
      The fonts live in this application (public/fonts, SIL OFL 1.1). Preloaded because the
      stylesheet that names them is discovered a round trip later, and the latin subset is
      what every screen needs first.
    -->
    <link
      rel="preload"
      href="/fonts/GoogleSansFlex-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Sets the appearance before the first paint, so a dark installation never flashes
      // white while the bundle loads. Deliberately duplicates the few lines from
      // src/lib/theme.ts: anything imported would arrive too late to help.
      ;(function () {
        try {
          var stored = localStorage.getItem('webux.theme')
          var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : system
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
